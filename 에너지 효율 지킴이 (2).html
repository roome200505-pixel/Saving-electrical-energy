const bad=t=>{const n=String(t).toLowerCase().replace(/[^0-9a-z가-힣ㄱ-ㅎ]/g,''),c=col(n);return BW.some(w=>n.includes(w)||c.includes(col(w)))};
const safe=t=>bad(t)?'<i>(부적절한 내용이 가려졌어요)</i>':esc(t);
function endGame(){okS();modal(`<h2>🏁 게임 끝!</h2><div style="font-size:50px">🏆</div><p>최종 ${grade}등급 · 미션 ${Object.keys(done).length}/10 · 설치 ${Object.keys(inst).length}개</p><p>🔑 내 방 코드 <b>${code}</b><br>친구에게 알려 주면 내 방에 놀러올 수 있어요!</p><button class="btn" onclick="closeM()">닫기</button>`)}
/* 미션 */
const Q={outlet:['안 쓰는 코드는 뽑는다.',1,'사용하지 않는 플러그를 뽑으면 대기전력을 줄일 수 있어요.'],badge:['에너지소비효율등급은 5단계가 가장 낮다.',0,'1등급이 효율이 가장 높고 숫자가 커질수록 효율이 낮아져요. 이 문항의 정답은 X로 설정되어 있어요.'],light:['세계 에너지의 날은 8월 22일이다.',1,'매년 8월 22일은 세계 에너지의 날로, 에너지 절약을 다짐하는 날이에요.'],window:['전기 에너지는 친환경 에너지라 낭비해도 된다.',0,'전기를 만들 때 자원이 쓰이고 환경에 영향을 주기 때문에 낭비하면 안 돼요.'],q1:['발전소에서 만들어진 전기 에너지는 변전소를 통해 전압을 바꿀 수 있다.',1,'변전소에서 전압을 높이거나 낮춰 안전하고 효율적으로 보내요.'],q2:['에너지 효율 등급에서 이산화탄소의 생산량을 알 수 있다.',1,'효율 등급표에는 이산화탄소 배출량 정보가 함께 표시돼요.']};
const FIN=(id,t)=>{done[id]=1;grade=Math.max(1,grade-1);okS();ui();modal(`<h2>🎉 미션 성공!</h2><p>${t}</p><p>등급이 한 단계 내려갔어요! (현재 ${grade}등급)</p><button class="btn pri" onclick="closeM()">확인</button>`)};
function mission(id){clk();if(visiting)return toast('친구 방은 구경만 할 수 있어요');if(done[id])return toast('이미 완료한 미션이에요!');if(grade<2)return toast('등급이 2 이상일 때 수행할 수 있어요');
if(['ac','boiler','light'].includes(id)&&0)return;
if(id=='ac')return modal(`<h2>❄️ 에어컨 리모컨</h2><p>에어컨의 온도를 적정온도로 맞춰 보세요!</p><div style="font-size:44px" id="tp">24</div><button class="btn" onclick="tp(-1)">➖</button><button class="btn" onclick="tp(1)">➕</button><br><button class="btn pri" onclick="acOk()">설정 완료</button>`);
if(id=='boiler')return modal(`<h2>🔥 절약 서약</h2><p>아래 문구를 똑같이 입력하세요.</p><p><b>날이 추워지면 옷을 겹쳐 입어 에너지를 절약하겠습니다.</b></p><input id="in1"><button class="btn pri" onclick="inChk('boiler','in1','날이 추워지면 옷을 겹쳐 입어 에너지를 절약하겠습니다.','추울 땐 옷을 겹쳐 입으면 난방 에너지를 아낄 수 있어요.')">제출</button>`);
if(id=='table')return modal(`<h2>🍽️ 나만의 절약 실천 3가지</h2><input id="t1" placeholder="1."><input id="t2" placeholder="2."><input id="t3" placeholder="3."><button class="btn pri" onclick="if(['t1','t2','t3'].some(i=>bad($(i).value))){badS();toast('바르고 고운 말로 적어 주세요!');return}if(['t1','t2','t3'].every(i=>$(i).value.trim())){tips=['t1','t2','t3'].map(i=>$(i).value.trim());FIN('table','직접 세운 실천 방법이 가장 오래가요!');saveRoom()}else{badS();toast('3가지를 모두 채워 주세요')}">제출</button>`);
if(id=='q3')return modal(`<h2>🔤 초성 퀴즈</h2><p>갑자기 많은 전력을 사용하게 되면 <b>ㅂㄹㅇㅅ</b>이 온다.</p><input id="in2"><button class="btn pri" onclick="inChk('q3','in2','블랙아웃','전력이 갑자기 부족해 정전이 되는 현상을 블랙아웃이라고 해요.')">제출</button>`);
const q=Q[id];modal(`<h2>❓ O/X 퀴즈</h2><p><b>${q[0]}</b></p><button class="btn pri" style="font-size:30px" onclick="ox('${id}',1)">⭕</button><button class="btn" style="font-size:30px" onclick="ox('${id}',0)">❌</button>`)}
let TP=24;const tp=d=>{TP=Math.min(30,Math.max(18,($('tp').textContent|0)+d));$('tp').textContent=TP;clk()};
function acOk(){TP=$('tp').textContent|0;TP>=26&&TP<=28?FIN('ac','여름철 적정 냉방온도는 26~28℃예요.'):(badS(),toast('아직 적정온도가 아니에요. 다시 맞춰 보세요!'))}
function inChk(id,i,a,t){$(i).value.trim()==a?FIN(id,t):(badS(),toast('다시 확인해 보세요!'))}
function ox(id,v){v==Q[id][1]?FIN(id,Q[id][2]):(badS(),toast('틀렸어요, 다시 도전!'))}
</script></body></html>
